:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);--tp:calc(env(safe-area-inset-top,0px) + .75rem)}

/* profile and group cards: exactly two per row, tight gap */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:42rem;margin-inline:auto}
.g2>*{min-width:0}
/* orphan card: when the last card sits alone in its row (1 profile, 1 group, 3, 5...) it spans the grid and is centred at exactly one column's width */
.g2>:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc((100% - 10px)/2);max-width:100%}
/* hide the scrollbar on the header's quick-action row */
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}.no-scrollbar::-webkit-scrollbar{display:none}

/* ---------- Quick actions carousel: paged, no native scrolling. The card clips every child to its own curve ---------- */
.qa{position:relative;display:flex;align-items:stretch;overflow:hidden;border-radius:1rem;min-height:2.75rem}
.qa-arrow{flex:0 0 2.25rem;display:grid;place-items:center;border:0;margin:0;padding:0;background:transparent;color:rgb(var(--ink));cursor:pointer;border-radius:0;transition:background-color .25s ease,opacity .25s ease,color .25s ease}
.qa-arrow.l{border-right:1px solid rgb(var(--line)/.7)}.qa-arrow.r{border-left:1px solid rgb(var(--line)/.7)}
.qa-arrow:hover:not(:disabled){background:rgb(var(--ink)/.08)}.qa-arrow:active:not(:disabled){background:rgb(var(--ink)/.14)}
.qa-arrow:disabled{opacity:.28;cursor:default}
.qa-arrow svg{width:1rem;height:1rem}
.qa-view{position:relative;flex:1 1 auto;min-width:0;display:grid;overflow:hidden;padding:.375rem .5rem}
.qa-page{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:.375rem;min-width:0;transition:opacity .38s cubic-bezier(.2,.8,.2,1),transform .38s cubic-bezier(.2,.8,.2,1);will-change:transform,opacity}
.qa-page[data-s=cur]{opacity:1;transform:none}
.qa-page[data-s=prev]{opacity:0;transform:translateX(-28px);pointer-events:none}
.qa-page[data-s=next]{opacity:0;transform:translateX(28px);pointer-events:none}
.qa-meas{position:absolute;left:0;top:0;display:flex;gap:.375rem;width:max-content;visibility:hidden;pointer-events:none}
.qa-chip{display:inline-flex;flex:0 0 auto;height:2rem;align-items:center;justify-content:center;gap:.375rem;white-space:nowrap;border-radius:9999px;border:1px solid rgb(var(--line)/.7);background:rgb(var(--ink)/.05);padding:0 .75rem;font-size:.75rem;line-height:1rem;font-weight:700;color:rgb(var(--ink));cursor:pointer;transition:background-color .2s ease,transform .15s ease,opacity .2s ease}
.qa-chip:hover:not(:disabled){background:rgb(var(--ink)/.1)}.qa-chip:active:not(:disabled){transform:scale(.97)}
.qa-chip:disabled{opacity:.4;cursor:default}
.qa-chip.pri{border-color:transparent;background:rgb(var(--accent));color:rgb(var(--accent-ink))}.qa-chip.pri:hover:not(:disabled){background:rgb(var(--accent));filter:brightness(1.06)}
.qa-chip.dng{color:rgb(var(--bad))}.qa-chip.dng:hover:not(:disabled){background:rgb(var(--bad)/.12)}
.qa-chip svg{width:.875rem;height:.875rem;flex:0 0 auto}
.qa-sw{position:relative;width:1.5rem;height:.875rem;flex:0 0 auto;border-radius:9999px;background:rgb(var(--ink)/.22);transition:background-color .25s ease}
.qa-sw::after{content:"";position:absolute;top:2px;left:2px;width:.625rem;height:.625rem;border-radius:9999px;background:rgb(var(--surface));transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.qa-sw.on{background:rgb(var(--accent))}.qa-sw.on::after{transform:translateX(.625rem);background:rgb(var(--accent-ink))}
/* ---------- tiger watermark in the title card (decor only, sits behind the text and never covers it) ---------- */
.tiger-wm{position:absolute;right:-.4rem;top:-.35rem;width:4.4rem;height:3.67rem;pointer-events:none;z-index:0;color:#fff;opacity:.95;transform:rotate(7deg);transform-origin:80% 20%;filter:drop-shadow(0 0 .7px rgb(var(--accent)/.85)) drop-shadow(0 1px 1px rgb(var(--accent)/.35))}
@media (min-width:640px){.tiger-wm{right:-.25rem;top:-.25rem;width:6.2rem;height:5.17rem}}
@media (min-width:900px){.tiger-wm{right:1.25rem;top:.25rem;width:8.5rem;height:7.1rem}}
/* the title row is tall enough for the tiger to sit beside "Gradely", so the intro text below never meets it */
.hdr-row{display:flex;align-items:center;justify-content:center;min-height:3.5rem}
@media (min-width:640px){.hdr-row{min-height:4.5rem}}
.hdr-txt{position:relative;z-index:1}
/* ---------- theme controls ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.25rem;border-radius:1rem;border:1px solid rgb(var(--line));background:rgb(var(--ink)/.05);padding:.25rem}
.seg>button{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.5rem;border:0;border-radius:.75rem;background:transparent;color:rgb(var(--muted));font-size:.875rem;font-weight:700;cursor:pointer;transition:background-color .25s ease,color .25s ease,box-shadow .25s ease}
.seg>button[aria-pressed=true]{background:rgb(var(--accent));color:rgb(var(--accent-ink));box-shadow:0 2px 10px -4px rgb(var(--accent)/.7)}
.seg svg{width:1rem;height:1rem}
@media (prefers-reduced-motion:reduce){.qa-page{transition-duration:.01ms!important}}
/* ---------- motion ---------- */
@keyframes swipeHint{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:none}}
.anim-rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.anim-fade{animation:fade .3s ease both}
.anim-sheet{animation:sheet .45s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slideR{from{opacity:0;transform:translateX(56px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-56px) scale(.985)}to{opacity:1;transform:none}}
.slide-r{animation:slideR .5s cubic-bezier(.2,.8,.2,1) backwards}
.slide-l{animation:slideL .5s cubic-bezier(.2,.8,.2,1) backwards}
.lift{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s,background-color .3s}
.lift:hover{transform:translateY(-2px)}
.lift:active{transform:translateY(-1px) scale(.99)}
.stagger>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(n+7){animation-delay:.3s}
.acc{display:grid;grid-template-rows:0fr;opacity:0;transition:all .3s ease-in-out}
.acc.open{grid-template-rows:1fr;opacity:1}
.acc>div{overflow:hidden;min-height:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="app.js"></script>
<!-- the service worker is registered (and its updates handled) inside app.js -->
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="sun">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>Grades Tracker and Forecaster</title>
<meta name="theme-color" content="#F6F6F3">
<meta name="description" content="Track grades, forecast finals and plan your GWA.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/tiger.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grades">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
// apply the saved theme before the first paint (no flash)
try{var t=localStorage.getItem('gtf-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<script>
['gesturestart','gesturechange','gestureend'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()},{passive:false})});
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
// Tailwind colours point at the CSS theme tokens below, so every theme restyles the whole app
window.tailwind&&(tailwind.config={theme:{extend:{colors:{
  bg:'rgb(var(--bg)/<alpha-value>)',surface:'rgb(var(--surface)/<alpha-value>)',surface2:'rgb(var(--surface2)/<alpha-value>)',
  ink:'rgb(var(--ink)/<alpha-value>)',muted:'rgb(var(--muted)/<alpha-value>)',line:'rgb(var(--line)/<alpha-value>)',
  accent:'rgb(var(--accent)/<alpha-value>)','accent-ink':'rgb(var(--accent-ink)/<alpha-value>)','accent-text':'rgb(var(--accent-text)/<alpha-value>)',
  good:'rgb(var(--good)/<alpha-value>)',bad:'rgb(var(--bad)/<alpha-value>)',sa:'rgb(var(--sa)/<alpha-value>)'}}}});
</script>
<style>
/* ---------- theme tokens (R G B triplets) ---------- */
:root,[data-theme=sun]{--bg:246 246 243;--surface:255 255 255;--surface2:248 247 241;--ink:28 27 24;--muted:118 114 104;--line:233 230 218;--accent:250 204 21;--accent-ink:42 34 4;--accent-text:161 98 7;--good:22 150 74;--bad:220 38 38;--glow:.2;color-scheme:light}
[data-theme=dark]{--bg:14 14 17;--surface:28 28 33;--surface2:40 40 47;--ink:246 246 248;--muted:152 152 165;--line:56 56 66;--accent:251 191 36;--accent-ink:30 22 2;--accent-text:252 211 77;--good:74 222 128;--bad:248 113 113;--glow:.12;color-scheme:dark}
[data-theme=mono]{--bg:250 250 250;--surface:255 255 255;--surface2:242 242 242;--ink:17 17 17;--muted:115 115 115;--line:226 226 226;--accent:17 17 17;--accent-ink:255 255 255;--accent-text:17 17 17;--good:17 17 17;--bad:120 120 120;--glow:.05;color-scheme:light}
[data-theme=lav]{--bg:247 245 255;--surface:255 255 255;--surface2:240 236 255;--ink:30 27 58;--muted:112 106 148;--line:226 220 248;--accent:124 58 237;--accent-ink:255 255 255;--accent-text:109 40 217;--good:5 150 105;--bad:225 29 72;--glow:.16;color-scheme:light}
[data-theme=blue]{--bg:244 248 255;--surface:255 255 255;--surface2:235 243 255;--ink:15 29 54;--muted:99 115 143;--line:214 227 247;--accent:37 99 235;--accent-ink:255 255 255;--accent-text:29 78 216;--good:5 150 105;--bad:220 38 38;--glow:.16;color-scheme:light}
[data-theme=bluedk]{--bg:8 13 24;--surface:17 26 44;--surface2:26 38 62;--ink:238 244 255;--muted:140 158 190;--line:38 54 84;--accent:96 165 250;--accent-ink:6 18 40;--accent-text:147 197 253;--good:74 222 128;--bad:248 113 113;--glow:.14;color-scheme:dark}
[data-theme=red]{--bg:255 247 247;--surface:255 255 255;--surface2:255 237 237;--ink:46 16 20;--muted:135 100 104;--line:247 220 222;--accent:220 38 38;--accent-ink:255 255 255;--accent-text:185 28 28;--good:22 150 74;--bad:127 29 29;--glow:.15;color-scheme:light}
[data-theme=reddk]{--bg:20 9 11;--surface:34 17 20;--surface2:48 25 29;--ink:255 240 241;--muted:188 150 154;--line:70 38 43;--accent:248 113 113;--accent-ink:40 8 10;--accent-text:252 165 165;--good:74 222 128;--bad:253 186 116;--glow:.13;color-scheme:dark}
[data-theme=green]{--bg:245 252 247;--surface:255 255 255;--surface2:232 247 237;--ink:14 40 26;--muted:94 128 108;--line:211 238 220;--accent:22 163 74;--accent-ink:255 255 255;--accent-text:21 128 61;--good:21 128 61;--bad:220 38 38;--glow:.15;color-scheme:light}
[data-theme=greendk]{--bg:8 18 13;--surface:16 31 23;--surface2:24 44 33;--ink:236 252 241;--muted:140 176 152;--line:36 62 46;--accent:74 222 128;--accent-ink:5 30 15;--accent-text:134 239 172;--good:134 239 172;--bad:248 113 113;--glow:.13;color-scheme:dark}
/* ---------- flat cards with depth: solid surface, hairline edge, soft layered shadow (no blur, no transparency) ---------- */
:root{--shd:0 1px 2px rgb(0 0 0/.05),0 6px 18px -8px rgb(0 0 0/.12);--shd2:0 2px 6px rgb(0 0 0/.06),0 22px 44px -18px rgb(0 0 0/.28)}
[data-theme=dark],[data-theme=bluedk],[data-theme=reddk],[data-theme=greendk]{--shd:0 1px 2px rgb(0 0 0/.5),0 8px 20px -10px rgb(0 0 0/.6);--shd2:0 2px 6px rgb(0 0 0/.5),0 24px 48px -18px rgb(0 0 0/.75)}
.glass,.gc{background:rgb(var(--surface));border:1px solid rgb(var(--line)/.8);box-shadow:var(--shd)}
/* sheets, menus and tooltips: same solid surface, a little more lift */
.gcs{background:rgb(var(--surface));border:1px solid rgb(var(--line)/.8);box-shadow:var(--shd2)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
/* iOS Safari zooms the page when a field under 16px gets focus: force exactly 16px on all of them */
input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{font-size:16px!important}
button,select,input,a{touch-action:manipulation}
input,textarea{caret-color:rgb(var(--accent))}
::selection{background:rgb(var(--accent)/.3)}
/* every subject accent follows the globally selected theme colour */
:root,.sa-0,.sa-1,.sa-2,.sa-3,.sa-4,.sa-5{--sa:var(--accent)}
/* ---------- base ---------- */
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);--tp:calc(env(safe-area-inset-top,0px) + .75rem)}
/* installed on a phone/tablet: always keep at least 3rem (pt-12) clear of the status bar and notch, even if iOS reports a 0 inset */
@media (display-mode:standalone) and (hover:none) and (pointer:coarse){:root{--tp:max(calc(env(safe-area-inset-top,0px) + .75rem),3rem)}}
html{scroll-padding-top:calc(var(--tp) + 4.5rem);width:100%;max-width:100vw;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
#root{width:100%;max-width:100vw;min-height:100vh;min-height:100dvh;overflow-x:clip}
body{margin:0;width:100%;max-width:100vw;min-height:100vh;min-height:100dvh;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:rgb(var(--ink));background:rgb(var(--bg));overflow-x:clip;-webkit-font-smoothing:antialiased;transition:background-color .45s ease,color .3s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:max(env(safe-area-inset-top,0px),0px);background:rgb(var(--bg));z-index:40}
button,input,select{font-family:inherit}
input[type=range]{accent-color:rgb(var(--accent));height:1.75rem}
select{color-scheme:inherit}select option{background:rgb(var(--surface));color:rgb(var(--ink))}
.tot{border-bottom:4px double currentColor}
input{font-variant-numeric:tabular-nums}
/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:none}}
.anim-rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.anim-fade{animation:fade .3s ease both}
.anim-sheet{animation:sheet .45s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slideR{from{opacity:0;transform:translateX(56px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-56px) scale(.985)}to{opacity:1;transform:none}}
.slide-r{animation:slideR .5s cubic-bezier(.2,.8,.2,1) backwards}
.slide-l{animation:slideL .5s cubic-bezier(.2,.8,.2,1) backwards}
.lift{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s,background-color .3s}
.lift:hover{transform:translateY(-2px)}
.lift:active{transform:translateY(-1px) scale(.99)}
.stagger>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(n+7){animation-delay:.3s}
.acc{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.acc.open{grid-template-rows:1fr;opacity:1}
.acc>div{overflow:hidden;min-height:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
